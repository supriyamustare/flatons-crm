# Flatons CRM — Nginx site config
# Installed to /etc/nginx/sites-available/flatons-crm
# HTTPS is added later by: sudo certbot --nginx -d <your-domain>

server {
    listen 80;
    listen [::]:80;
    server_name _;   # replace with your domain once DNS is set up

    server_tokens off;
    client_max_body_size 12m;   # uploads are capped at 10 MB by the API

    # Basic security headers (full CSP added in Sprint 16)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/flatons-crm;
    index index.html;

    # API -> FastAPI (Gunicorn on localhost only)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # App manifest for "Add to Home Screen" / install
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # React app: unknown paths fall back to index.html.
    # "expires -1" makes browsers re-check index.html on every visit, so a deploy is picked
    # up immediately (the JS/CSS files it points to have new names each build).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
