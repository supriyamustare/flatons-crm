[project]
name = "flatons-crm-backend"
version = "0.1.0"
description = "Flatons CRM — FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "uvicorn-worker>=0.2",
    "gunicorn>=23.0",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4,<6",
    "redis>=5.0",
    "pyjwt (>=2.9)",
    "bcrypt (>=4.2)",
    "email-validator (>=2.2)",
    "python-multipart (>=0.0.12)",
    "cryptography (>=43)",
    "httpx (>=0.27)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
httpx = ">=0.27"
ruff = ">=0.8"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Plain-English metric definitions shown to users; wrapping them would hurt readability
"app/services/reports.py" = ["E501"]
"app/api/reports.py" = ["E501"]
"app/models/booking.py" = ["E501"]
"app/api/bookings.py" = ["E501"]
"app/services/bookings.py" = ["E501"]
"app/services/overview.py" = ["E501"]
"tests/test_overview.py" = ["E501"]
"tests/test_bookings.py" = ["E501"]
# List of accepted field names per platform; reads best one per line
"app/services/inbound.py" = ["E501"]
# Reference SQL written out in full, so it reads as plain SQL
"tests/test_reports.py" = ["E501"]
"tests/test_pipeline.py" = ["E501"]
"tests/test_dashboard.py" = ["E501"]
"tests/test_inbound.py" = ["E501"]
